name: Bug
description: Something is not working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: Actual behaviour, with the exact error if there is one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
